[project]
name = "alpaca-mcp-trading-agent"
version = "0.1.0"
description = "Autonomous Multi-Agent Options Spread Trading System via Alpaca MCP and SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alpaca-py>=0.22.0",
    "mcp>=0.1.0",
    "openai>=1.12.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
