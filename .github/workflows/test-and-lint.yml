name: Test and Lint Pipeline

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Matrix
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Architecture Dependencies
      run: |
        python -m pip install --upgrade pip
        # Install the dependencies and test utilities declared inside pyproject.toml
        pip install .

    - name: Run Architecture Linter Verification
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Execute Automated Unit Testing
      run: |
        pytest
      
